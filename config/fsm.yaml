# Member 1: main loop, state machine and safety parameters (loaded into ~ of go1_ctrl_node).
rate: 500.0               # control loop [Hz]
cmd_vel_timeout: 0.5      # zero the velocity command if teleop is silent this long [s]

# Stand: interpolate from the current pose to stand_q (per leg: hip, thigh, calf) in stand_time.
stand_q: [0.0, 0.67, -1.3]
stand_time: 2.0
stand_kp: 180.0
stand_kd: 8.0
passive_kd: 8.0           # PASSIVE = Kp 0, this Kd (damped, the legs fold slowly)

# Safety. Joint limits from go1_description (go1.urdf), per leg: hip, thigh, calf.
q_min: [-1.047, -0.663, -2.721]
q_max: [ 1.047,  2.966, -0.837]
tau_max: [23.7, 23.7, 35.55]  # [Nm]
fall_angle: 1.047         # tilt that counts as a fall [rad] (60 deg)
min_height: 0.12          # body height that counts as a fall, only with ground truth [m]
