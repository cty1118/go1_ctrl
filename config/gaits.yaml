# Owners: Member 3 (walk, trot) and Member 4 (canter, gallop). Gait parameters.
# Leg order: FR, FL, RR, RL. Offsets are TOUCHDOWN phases (subtracted).
# Initial development values, NOT hardware-tuned.
gaits:
  transition_time: 0.6
  ground_walk: true
  walk:
    period: 1.6
    offset: [0.0, 0.5, 0.75, 0.25]
    duty: [0.8, 0.8, 0.8, 0.8]
  trot:
    period: 0.6
    offset: [0.0, 0.5, 0.5, 0.0]
    duty: [0.6, 0.6, 0.6, 0.6]
  # ---- Member 4: canter and gallop ----
  # TODO(Member 4 + 3): check canter offsets. The middle beat of a canter should be
  # a diagonal pair (RR + FL), e.g. [0.6, 0.3, 0.3, 0.0]. First trials without a
  # flight phase (duty about 0.45-0.5) until the stance controller is ready.
  canter:
    period: 0.8
    offset: [0.3, 0.6, 0.3, 0.0]
    duty: [0.35, 0.35, 0.35, 0.35]
  gallop:
    period: 0.7
    offset: [0.5, 0.65, 0.0, 0.15]
    duty: [0.3, 0.3, 0.3, 0.3]