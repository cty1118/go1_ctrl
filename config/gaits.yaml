# Owners: Member 3 (walk, trot) and Member 4 (canter, gallop). Gait parameters.
#
# Leg order: FR, FL, RR, RL. offset = phase offset as a fraction of the period,
# duty = fraction of the period the leg is in contact.
# The key names are Member 4's proposal; align them with Member 3's scheduler.

# ---- Member 4: Canter and Gallop (first trial: no flight phase yet) ----
# Canter, 3-beat: RL, then the diagonal pair RR + FL together, then FR (lead leg).
canter:
  period: 0.45
  offset: [0.66, 0.33, 0.33, 0.0]
  duty: [0.5, 0.5, 0.5, 0.5]
  step_height: 0.08

# Transverse gallop, 4-beat: RL, RR, FL, FR.
gallop:
  period: 0.35
  offset: [0.6, 0.5, 0.1, 0.0]
  duty: [0.45, 0.45, 0.45, 0.45]
  step_height: 0.06
