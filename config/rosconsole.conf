# Member 1: logging levels for sim.launch.
# unitree_legged_control triggers a class_loader "namespace collision" warning in gzserver
# continuously (millions of lines a minute). It is harmless but slows Gazebo to ~10 % real time,
# so it is silenced here. Everything else logs as usual.
log4j.logger.ros=INFO
log4j.logger.ros.roscpp.superdebug=WARN
log4j.logger.ros.rosconsole_bridge.class_loader.impl=ERROR
